<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<title>🎂 有一份惊喜给你</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #ffe9f2 0%, #ffd6e8 40%, #ffc8de 100%);
    color: #ff4d88;
    user-select:none;
    touch-action: manipulation;
  }
  #canvas {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:1;
  }
  .scene {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:2;
    transition: opacity 0.8s ease;
    padding: 30px 20px;
    text-align:center;
  }

  /* 开屏 */
  .heart-btn {
    width: 170px; height: 150px;
    position:relative;
    margin: 0 auto 36px;
    cursor:pointer;
    animation: heartbeat 1.3s ease-in-out infinite;
    filter: drop-shadow(0 12px 30px rgba(255,77,136,0.45));
  }
  .heart-btn::before, .heart-btn::after {
    content:""; position:absolute;
    width: 90px; height: 140px;
    background: linear-gradient(135deg, #ff8fb8 0%, #ff4d88 100%);
    border-radius: 90px 90px 0 0;
    top: 0;
  }
  .heart-btn::before { left: 40px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .heart-btn::after  { left: 40px; transform: rotate(45deg);  transform-origin: 100% 100%; }
  .heart-label {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:2; color: white; font-size: 22px; font-weight: bold;
    text-shadow: 0 2px 6px rgba(200,30,90,0.4);
    transform: translateY(6px);
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.1); }
    30% { transform: scale(0.98); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }
  #intro h1 {
    font-size: 26px; margin-bottom: 10px; color:#ff4d88;
    animation: fadeInUp 0.8s ease 0.3s backwards;
  }
  #intro p {
    font-size: 14px; color:#c94880; opacity:0.9;
    animation: fadeInUp 0.8s ease 0.6s backwards;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(15px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* 主场景 */
  #main { opacity: 0; pointer-events: none; }
  #main.show { opacity: 1; pointer-events: auto; }
  .title {
    font-size: 40px; font-weight: 900;
    background: linear-gradient(90deg, #ff4d88, #b24dff, #ff8fb8, #ff4d88);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 36px;
    animation: shine 4s linear infinite, pop 0.7s cubic-bezier(.34,1.56,.64,1);
    letter-spacing: 3px;
    text-shadow: 0 4px 20px rgba(255,77,136,0.15);
  }
  @keyframes shine { to { background-position: 300% center; } }
  @keyframes pop {
    0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  /* 蛋糕 */
  .cake {
    width: 220px; height: 210px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .cake:active { transform: scale(0.96); }
  .cake .plate {
    position:absolute; bottom: 0; left: 10px;
    width: 200px; height: 18px;
    background: linear-gradient(180deg, #fff, #f5c1d9);
    border-radius: 50%;
    box-shadow: 0 6px 16px rgba(255,77,136,0.25);
  }
  .cake .layer-bottom {
    position:absolute;
    bottom: 14px; left: 25px; width: 170px; height: 72px;
    background: linear-gradient(180deg, #ffb6d4, #ff8cb8);
    border-radius: 6px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.08);
  }
  .cake .drip {
    position:absolute; bottom: 78px; left: 25px; width: 170px; height: 14px;
    background:
      radial-gradient(circle at 10% 0, #fff 0 7px, transparent 8px),
      radial-gradient(circle at 25% 0, #fff 0 5px, transparent 6px),
      radial-gradient(circle at 42% 0, #fff 0 8px, transparent 9px),
      radial-gradient(circle at 58% 0, #fff 0 6px, transparent 7px),
      radial-gradient(circle at 75% 0, #fff 0 8px, transparent 9px),
      radial-gradient(circle at 90% 0, #fff 0 6px, transparent 7px),
      linear-gradient(180deg, #fff 40%, #ffe0ec 100%);
    border-radius: 0 0 8px 8px;
  }
  .cake .layer-top {
    position:absolute;
    bottom: 88px; left: 55px; width: 110px; height: 52px;
    background: linear-gradient(180deg, #fff0f6, #ffccdd);
    border-radius: 6px;
    box-shadow: inset 0 -6px 0 rgba(255,77,136,0.1);
  }
  .cake .dot {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#ff4d88;
  }
  .cake .candle {
    position:absolute; bottom: 140px; left: 50%;
    width: 10px; height: 30px;
    background: repeating-linear-gradient(45deg, #ff99c0 0 4px, #fff 4px 8px);
    transform: translateX(-50%);
    border-radius: 2px;
  }
  .cake .flame {
    position:absolute; bottom: 170px; left: 50%;
    width: 14px; height: 22px;
    background: radial-gradient(ellipse at center bottom, #fff06b 10%, #ff9d3b 70%, #ff4d00 100%);
    border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
    transform: translateX(-50%);
    animation: flicker 0.25s ease-in-out infinite alternate;
    box-shadow: 0 0 20px 6px rgba(255,200,100,0.7);
  }
  @keyframes flicker {
    from { transform: translateX(-50%) scale(1, 1) rotate(-3deg); opacity: 0.95; }
    to   { transform: translateX(-50%) scale(1.1, 0.92) rotate(3deg); opacity: 1; }
  }
  .cake.blown .flame { opacity:0; transform: translateX(-50%) scale(0.5); transition: all 0.3s; }

  .hint {
    margin-top: 32px;
    font-size: 14px; color: #c94880;
    animation: breathe 2s ease-in-out infinite;
    letter-spacing: 1px;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 祝福场景 */
  .wish {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 3;
    pointer-events: none;
    opacity: 0; transform: scale(0.9);
    transition: all 0.9s cubic-bezier(.34,1.56,.64,1);
    padding: 30px;
    text-align:center;
    background: radial-gradient(ellipse at center, rgba(255,77,136,0.2) 0%, transparent 70%);
  }
  .wish.show { opacity: 1; transform: scale(1); pointer-events:auto; }
  .wish h2 {
    font-size: 30px; color: #fff;
    text-shadow:
      0 0 10px #ff4d88,
      0 0 25px #ff4d88,
      0 0 45px rgba(255,77,136,0.6);
    margin-bottom: 26px;
    line-height: 1.6;
    font-weight: 900;
    letter-spacing: 2px;
  }
  .wish p {
    font-size: 16px; color: #fff;
    text-shadow: 0 0 10px #ff4d88, 0 0 20px rgba(255,77,136,0.8);
    max-width: 320px; line-height: 2.2;
    font-weight: 500;
  }
  .replay {
    margin-top: 40px;
    padding: 13px 34px;
    background: rgba(255,255,255,0.95);
    color: #ff4d88;
    border: none; border-radius: 30px;
    font-size: 15px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,77,136,0.4);
    letter-spacing: 1px;
  }
  .replay:active { transform: scale(0.96); }

  @media (max-height: 600px) {
    .title { font-size: 32px; margin-bottom: 20px; }
    .cake { transform: scale(0.85); }
    .heart-btn { transform: scale(0.85); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="intro" class="scene">
  <div class="heart-btn" onclick="start()">
    <span class="heart-label">戳我呀</span>
  </div>
  <h1>有一份小惊喜给你 🎀</h1>
  <p>✨ 记得把音量打开哦 ✨</p>
</div>

<div id="main" class="scene">
  <div class="title">🎂 生日快乐 🎂</div>
  <div class="cake" id="cake" onclick="blowCandle()">
    <div class="plate"></div>
    <div class="layer-bottom"></div>
    <div class="drip"></div>
    <div class="layer-top"></div>
    <div class="dot" style="bottom: 100px; left: 75px;"></div>
    <div class="dot" style="bottom: 115px; left: 110px; background:#b24dff;"></div>
    <div class="dot" style="bottom: 100px; left: 140px;"></div>
    <div class="candle"></div>
    <div class="flame"></div>
  </div>
  <div class="hint">☝️ 许个愿，点一下吹蜡烛～</div>
</div>

<div id="wish" class="wish">
  <h2>愿你今年<br>每一天都甜甜的 🍰</h2>
  <p>🌸 被喜欢的人喜欢 🌸<br>🌟 被温柔的世界温柔以待 🌟<br>💝 所有小心愿都能成真 💝</p>
  <button class="replay" onclick="replay()">再看一次 ✨</button>
</div>

<script>
// ---------- 粒子系统 ----------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
resize();
addEventListener('resize', resize);

const petals = [];
const fireworks = [];

class Petal {
  constructor(init) {
    this.reset(init);
  }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : -30 * DPR;
    this.size = (5 + Math.random() * 8) * DPR;
    this.speed = (0.4 + Math.random() * 1.1) * DPR;
    this.drift = (Math.random() - 0.5) * 1.5 * DPR;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
    const types = ['heart', 'star', 'petal', 'heart', 'petal'];
    this.type = types[Math.floor(Math.random() * types.length)];
    const colors = ['#ff6ba0', '#ff8fb8', '#ffb6d4', '#ffccdd', '#ffd6e8', '#ff4d88', '#c18fff'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.alpha = 0.55 + Math.random() * 0.4;
    this.sway = Math.random() * Math.PI * 2;
  }
  update() {
    this.sway += 0.02;
    this.y += this.speed;
    this.x += this.drift + Math.sin(this.sway) * 0.6 * DPR;
    this.rot += this.rotSpeed;
    if (this.y > H + 30 * DPR) this.reset(false);
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.fillStyle = this.color;
    if (this.type === 'heart') this.drawHeart();
    else if (this.type === 'star') this.drawStar();
    else {
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  drawHeart() {
    const s = this.size * 0.9;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s, -s*0.4, -s*0.55, -s, 0, -s*0.35);
    ctx.bezierCurveTo(s*0.55, -s, s, -s*0.4, 0, s*0.35);
    ctx.fill();
  }
  drawStar() {
    const s = this.size * 0.9;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
      const x1 = Math.cos(a) * s, y1 = Math.sin(a) * s;
      const a2 = a + Math.PI / 5;
      const x2 = Math.cos(a2) * s * 0.42, y2 = Math.sin(a2) * s * 0.42;
      if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();
    ctx.fill();
  }
}

class Firework {
  constructor(x, y) {
    this.particles = [];
    const colors = ['#ff4d88', '#ff99c0', '#ffccdd', '#b24dff', '#ffeb80', '#fff', '#ffaacf'];
    const main = colors[Math.floor(Math.random() * colors.length)];
    const count = 70;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
      const speed = (2 + Math.random() * 4.5) * DPR;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: Math.random() < 0.3 ? '#fff' : main,
        size: (2 + Math.random() * 2.5) * DPR
      });
    }
  }
  update() {
    for (const p of this.particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08 * DPR;
      p.vx *= 0.985;
      p.life -= 0.012;
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }
  draw() {
    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  get done() { return this.particles.length === 0; }
}

for (let i = 0; i < 65; i++) petals.push(new Petal(true));

function loop() {
  ctx.clearRect(0, 0, W, H);
  for (const p of petals) { p.update(); p.draw(); }
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw();
    if (fireworks[i].done) fireworks.splice(i, 1);
  }
  requestAnimationFrame(loop);
}
loop();

function launchFirework() {
  const x = (Math.random() * 0.7 + 0.15) * W;
  const y = (Math.random() * 0.4 + 0.15) * H;
  fireworks.push(new Firework(x, y));
  playPop();
}

// ---------- 音频 ----------
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playNote(freq, start, duration, gain = 0.12) {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, now + start);
  g.gain.linearRampToValueAtTime(gain, now + start + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now + start);
  osc.stop(now + start + duration + 0.05);
  // 叠加一个高八度的轻柔正弦，让声音更可爱
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  g2.gain.setValueAtTime(0, now + start);
  g2.gain.linearRampToValueAtTime(gain * 0.3, now + start + 0.03);
  g2.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
  osc2.connect(g2).connect(audioCtx.destination);
  osc2.start(now + start);
  osc2.stop(now + start + duration + 0.05);
}
function playPop() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(900, now);
  osc.frequency.exponentialRampToValueAtTime(120, now + 0.35);
  g.gain.setValueAtTime(0.12, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.45);
}

// 生日快乐歌 (C大调)
const N = {
  G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
};
const BPM = 118;
const beat = 60 / BPM;
const SONG = [
  [N.G4, 0.5], [N.G4, 0.5], [N.A4, 1], [N.G4, 1], [N.C5, 1], [N.B4, 2],
  [N.G4, 0.5], [N.G4, 0.5], [N.A4, 1], [N.G4, 1], [N.D5, 1], [N.C5, 2],
  [N.G4, 0.5], [N.G4, 0.5], [N.G5, 1], [N.E5, 1], [N.C5, 1], [N.B4, 1], [N.A4, 2],
  [N.F5, 0.5], [N.F5, 0.5], [N.E5, 1], [N.C5, 1], [N.D5, 1], [N.C5, 2.5]
];
let songTimer;
function playSong() {
  if (!audioCtx) return;
  let t = 0;
  for (const [freq, dur] of SONG) {
    playNote(freq, t, dur * beat * 0.92);
    t += dur * beat;
  }
  songTimer = setTimeout(playSong, t * 1000 + 800);
}

// ---------- 流程 ----------
function start() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  intro.style.pointerEvents = 'none';
  setTimeout(() => {
    intro.style.display = 'none';
    document.getElementById('main').classList.add('show');
    playSong();
    launchFirework();
    setInterval(launchFirework, 2600);
  }, 700);
}

let blown = false;
function blowCandle() {
  if (blown) return;
  blown = true;
  document.getElementById('cake').classList.add('blown');
  for (let i = 0; i < 7; i++) {
    setTimeout(() => { launchFirework(); launchFirework(); }, i * 280);
  }
  setTimeout(() => {
    document.getElementById('wish').classList.add('show');
  }, 900);
}
function replay() {
  document.getElementById('wish').classList.remove('show');
  document.getElementById('cake').classList.remove('blown');
  blown = false;
  for (let i = 0; i < 4; i++) setTimeout(launchFirework, i * 200);
}
</script>
</body>
</html>
